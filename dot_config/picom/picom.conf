# vim: filetype=conf
backend = "glx";
use-damage = true;
vsync = false;

# xprop WM_CLASS

corner-radius = 6.0;
round-borders = 1;
rounded-corners-exclude = [
    "! name~=''",
    "class_g = 'Dunst'",
    "class_g = 'copyq'",
    "class_g = 'Ibus-ui-gtk3'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];
rounded-borders-exclude = [
    "! name~=''",
    "class_g = 'Dunst'",
    "class_g = 'Ibus-ui-gtk3'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
]

#Shadow
shadow = true;			# Enabled client-side shadows on windows.
shadow-radius = 15;		# The blur radius for shadows. (default 12)
shadow-offset-x = -15;		# The left offset for shadows. (default -15)
shadow-offset-y = -1;		# The top offset for shadows. (default -15)
shadow-opacity = 0.2;
shadow-exclude = [
    "! name~=''",
    "class_g = 'Rofi'",
    "class_g = 'TelegramDesktop'",
    "class_g = 'mpv'",
    "class_g = 'fcitx'",
    "class_g = 'Fcitx'",
    "class_g = 'wechat'",
    "class_g = 'WeChat'",
    "class_g = 'com.tencent.WeChat'",
    "window_type *= 'menu'",
    "window_type *= 'popup'",
    "window_type *= 'dropdown'",
    "window_type *= 'tooltip'",
    "window_type = 'normal'"
];

# Fading
fading = true; # Fade windows during opacity changes.
fade-delta = 5; # The time between steps in a fade in milliseconds. (default 10).
fade-in-step = 0.03; # Opacity change between steps while fading in. (default 0.028).
fade-out-step = 0.03; # Opacity change between steps while fading out. (default 0.03).
#no-fading-openclose = true; # Fade windows in/out when opening/closing

detect-client-opacity = true; # This prevents opacity being ignored for some apps. For example without this enabled my xfce4-notifyd is 100% opacity no matter what.

# Animation settings
transition-length = 300;
transition-pow-x = 0.99;
transition-pow-y = 0.99;
transition-pow-w = 0.99;
transition-pow-h = 0.99;
size-transition = true;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  menu        = { shadow = false; opacity = false; }
  popup_menu = { opacity = false; }
  dropdown_menu = { opacity = false; }
};


