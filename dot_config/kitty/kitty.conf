#: Shell {{{

shell_integration no-cursor
shell zsh --login
term xterm-kitty

#: }}}

#: Font {{{

font_family      Hack
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF PingFang SC
font_size 12.5

#: }}}

#: Cursor {{{

cursor none
cursor_blink_interval 0
cursor_stop_blinking_after 0

#: }}}

#: Scrollback {{{

scrollback_lines 10000
input_delay 30

#: }}}

#: Mouse {{{

copy_on_select clipboard
strip_trailing_spaces smart
mouse_map left click ungrabbed
mouse_map shift+left click grabbed,ungrabbed
mouse_map ctrl+shift+left release grabbed,ungrabbed
mouse_map ctrl+shift+left press grabbed
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event
mouse_map right press grabbed,ungrabbed paste_from_clipboard
mouse_map right click grabbed,ungrabbed discard_event
mouse_map right doubleclick grabbed,ungrabbed discard_event
select_by_word_characters !#$%*+-./:;<>@\^_~

#: }}}

#: Window layout {{{

remember_window_size no
initial_window_width 900
initial_window_height 600
window_border_width 1
window_padding_width 18 15 5 15
active_border_color #75A1FF
inactive_border_color #676E95
background_opacity 0.95

#: }}}

#: Tab bar {{{

tab_bar_style custom
watcher tab_bar.py
tab_bar_min_tabs 1
tab_switch_strategy left
tab_title_max_length 25
tab_title_template "{index}: {tab.active_exe if tab.active_exe else 'shell'}"
active_tab_foreground #d2d8d9
active_tab_background #45474b
active_tab_font_style normal
inactive_tab_foreground #888888
inactive_tab_background #35373a
tab_bar_background #2b2c2e

#: }}}

#: Keyboard shortcuts {{{

map ctrl+tab            next_tab
map ctrl+shift+tab      previous_tab
map ctrl+1              goto_tab 1
map ctrl+2              goto_tab 2
map ctrl+3              goto_tab 3
map ctrl+4              goto_tab 4
map ctrl+5              goto_tab 5
map ctrl+6              goto_tab 6
map ctrl+7              goto_tab 7
map ctrl+8              goto_tab 8
map ctrl+9              goto_tab 9
map ctrl+left           previous_tab
map ctrl+right          next_tab
map ctrl+t              new_tab
map ctrl+shift+t        new_tab
map ctrl+shift+r        load_config_file
map ctrl+shift+w        close_tab
map ctrl+shift+l        debug_config
map ctrl+shift+f        search_scrollback
map ctrl+shift+p        command_palette
map ctrl+page_up        previous_tab
map ctrl+page_down      next_tab
map ctrl+shift+page_up  move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+plus               increase_font_size
map ctrl+minus              decrease_font_size
map ctrl+0                 restore_font_size
map alt+enter              toggle_fullscreen
map super+v paste_from_clipboard
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map page_up scroll_page_up
map page_down scroll_page_down
map ctrl+shift+k clear_terminal scrollback active
map super+k clear_terminal scrollback active

#: }}}

#: Colors {{{

include anton.conf

#: }}}

#: Bell {{{

enable_audio_bell no

#: }}}
