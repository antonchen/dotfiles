[colors]
bg = #2E3440
fg = #ECEFF4

blue = #81A1C1
cyan = #88C0D0
green = #A3BE8C
red = #BF616A
yellow = #EBCB8B
pink = #C394B4

black = #3B4252
white = #D8DEE9

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[bar/top]
dpi = 112
width = 100%
height = 19pt
radius = 0.0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 0
padding-right = 0

border-size = 4pt
border-color = ${colors.bg}

module-margin-left = 0
module-margin-right = 0

font-0 = "Hack:style=Bold:size=11;3"
font-1 = "SauceCodePro Nerd Font Mono:size=19;5"
font-2 = "Source Han Sans SC:style=Bold:size=11;3"
font-3 = "Noto Color Emoji:size=11:scale=10;3"

# Module order
modules-left = updates-yay left1 bspwm left2
modules-center = medium1 windowtitle medium2
modules-right = right1 wired-network filesystem cpu memory pulseaudio-control date right2 shutdown tray

cursor-click = pointer
cursor-scroll = pointer

line-size = 1.5pt

# Powerline separators
[module/left1]
type = custom/text
format-foreground = ${colors.black}
format = " "

[module/left2]
type = custom/text
format-foreground = ${colors.black}
format = ""

[module/medium1]
type = custom/text
format-foreground = ${colors.black}
format = " "

[module/medium2]
type = custom/text
format-foreground = ${colors.black}
format = ""

[module/right1]
type = custom/text
format-foreground = ${colors.black}
format = " "

[module/right2]
type = custom/text
format-foreground = ${colors.black}
format = ""



;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
# Workspaces
[module/bspwm]
type = internal/bspwm

; Available tokens: %name%, %icon%, %index%
label-focused = "%name%"
label-focused-background = ${colors.black}
label-focused-foreground = #88C0D0
label-focused-padding = 7pt

label-occupied = %name%
label-occupied-background = ${colors.black}
label-occupied-foreground = #D8DEE9
label-occupied-padding = 7pt

label-urgent = %name%
label-urgent-background = ${colors.black}
label-urgent-foreground = #BF616A
label-urgent-padding = 7pt

label-empty = %name% 
label-empty-background = ${colors.black}
label-empty-foreground = #2E3440
label-empty-padding = 7pt


; Separator in between workspaces
label-separator = 
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

# Package updates
[module/updates-apt]
type = custom/script
exec = ~/.config/polybar/updates-apt
click-left = sudo /usr/bin/apt-get update > /dev/null 1>&2
interval = 600
label = "  %output%  "

format-foreground = ${colors.red}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/updates-yay]
type = custom/script
exec = ~/.config/polybar/updates-yay
tail = true
click-left = sudo /usr/bin/yay -Syy > /dev/null 2>&1
click-right = ~/.config/polybar/updates-yay mark-read
interval = 600
label = "  %output%  "
format-foreground = ${colors.red}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

# System status
[module/filesystem]
type = internal/fs
mount-0 = /
interval = 10
fixed-values = true
spacing = 3pt
format-mounted = <label-mounted>
format-unmounted = <label-unmounted>
; Available tokens: %mountpoint%, %type%, %fsname%, %percentage_free%, %percentage_used%, %total%, %free%, %used%
label-mounted = " %free% "

label-unmounted = %mountpoint%: not mounted
label-unmounted-foreground = #55
label-unmounted-background = ${colors.black}
label-mounted-background = ${colors.black}

label-mounted-foreground = ${colors.blue}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/windowtitle]
type = internal/xwindow
format = <label>
format-background = ${colors.black}
format-foreground = ${colors.cyan}
format-padding = 2pt
; Available tokens: %title%, %instance%, %class%
label = "  %title%"
label-maxlen = 50
label-empty = "  "
label-separator = " "
label-empty-foreground = ${colors.cyan}
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/pulseaudio-control]
type = custom/script
tail = true
label-padding = 1.5pt
format-background = ${colors.black}
format-foreground = ${colors.cyan}

exec = $HOME/.config/polybar/pipewire-control --icons-volume " , " --icon-muted " " --notifications=yes listen
; %output% is formatted by pipewire-control.
click-left = $HOME/.config/polybar/pipewire-control togmute
click-right = $HOME/.config/polybar/pipewire-control next-sink
scroll-up = $HOME/.config/polybar/pipewire-control --volume-max 130 up
scroll-down = $HOME/.config/polybar/pipewire-control --volume-max 130 down

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/memory]
type = internal/memory
interval = 3

; Available tokens: %percentage_used%, %percentage_free%, %used%, %free%, %total%, %gb_used%, %gb_free%, %gb_total%, %mb_used%, %mb_free%, %mb_total%, %percentage_swap_used%, %percentage_swap_free%, %swap_total%, %swap_free%, %swap_used%, %gb_swap_total%, %gb_swap_free%, %gb_swap_used%, %mb_swap_total%, %mb_swap_free%, %mb_swap_used%
label = " %gb_used%/%gb_free% "

format-background = ${colors.black}
format-foreground = ${colors.pink}
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/wired-network]
type = internal/network
interface = eno1
interval = 3.0

accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-disconnected = <label-disconnected>

; Available tokens: %ifname%, %local_ip%, %local_ip6%, %upspeed%, %downspeed%, %netspeed%, %linkspeed% [wired], %mac%; %essid%, %signal% [wireless]
label-connected = " %upspeed%  %downspeed% "
label-connected-foreground = ${colors.green}
label-connected-background = ${colors.black}

label-disconnected = "  "
label-disconnected-foreground = ${colors.red}
label-disconnected-background = ${colors.black}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/cpu]
type = internal/cpu

interval = 1
format = <label>
label = "󰻠 %percentage%% "

format-background = ${colors.black}
format-foreground = ${colors.yellow}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/date]
type = internal/date
interval = 1

date = 
date-alt = "󰸗 %F %A"

time = "  %H:%M "
time-alt = "%H:%M:%S "

format-background = ${colors.black}
format-foreground = ${colors.white}

label = %date% %time%
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/shutdown]
type = custom/text
format = " "
format-foreground = ${colors.red}
format-padding = 1.5pt
click-left = $HOME/.config/polybar/rofi-poweroff
click-right = $HOME/.config/polybar/rofi-poweroff 
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[module/tray]
type = internal/tray

tray-position = right
tray-maxsize = 20
tray-padding = 1.5pt
tray-background = ${colors.bg}
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[settings]
screenchange-reload = true
; vim:ft=dosini
